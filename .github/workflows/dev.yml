name: Dev installer

on:
  push:
    branches: [main]

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $info = node scripts/resolve-version.mjs | ConvertFrom-Json
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "artifact=$($info.artifact)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Stage artifact
        env:
          ARTIFACT: ${{ steps.ver.outputs.artifact }}
        shell: pwsh
        run: Copy-Item installer/target/release/bhchat-installer.exe $env:ARTIFACT

      - name: Release notes
        run: node scripts/release-notes.mjs --out release-notes.md

      - name: Publish rolling dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.ver.outputs.artifact }}
        shell: pwsh
        run: |
          gh release view dev 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete dev --cleanup-tag --yes
          }
          gh release create dev --prerelease --title "dev" --notes-file release-notes.md --target $env:GITHUB_SHA $env:ARTIFACT
