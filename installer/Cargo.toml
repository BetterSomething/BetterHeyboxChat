[package]
name = "bhchat-installer"
version = "0.1.0"
edition = "2021"
description = "BetterHeyboxChat 图形化安装器"

[[bin]]
name = "bhchat-installer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
include_dir = "0.7"
rfd = "0.15"
is_elevated = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
strip = true
lto = true
codegen-units = 1
